    <h4>Registration Form</h4>
    <form action="#">
        <input type="text"placeholder="username">
        <br><br>
          <input type="password"placeholder="password">
        <br>
        <h5>Select you class</h5>
          <label for="101">
          <input type="radio"value="class XI" name="class">class XI
            </label>
            <br/>
            <label for="102">
          <input type="radio"value="class X11" name="class">class X11
          </label>
          <br>
          <h5>Select your subject</h5>
          <label for="math">
            <input type="checkbox"value="math"name="subject"id="101">math
          </label>
          <br>
          <label for="physics">
            <input type="checkbox"value="phy"name="subject"id="102">physics
          </label>
          <br>
          <label for="chemistry">
            <input type="checkbox"value="chemistry"name="subject"id="103">chemistry
          </label>
          <br>
          <label for="english">
            <input type="checkbox"value="eng"name="subject"id="104">english
          </label>
          <br>
          <h5>Select your city</h5>
          <select name="city">
                <option value="Delhi">Delhi</option>
                 <option value="Mumbai">Mumbai</option>
                  <option value="Bihar">Bihar</option>
                   <option value="Panjab">Panjab</option>

          <br><br>
       <textarea name="feedback"id="101"placeholder ="please give your valueable feedback here"rows=5>feedback</textarea>
       <input type="submit"value="submit">
